    <title>نظام معلومات المختبرات الطبية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- PDF Generation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
      :root {
        --font-sans: 'Cairo', sans-serif;
        --color-primary: #0d9488; /* Teal 600 */
        --color-primary-hover: #0f766e; /* Teal 700 */
        --color-primary-light: #f0fdfa; /* Teal 50 */
        --border-radius-sm: 0.5rem; /* 8px */
        --border-radius-md: 0.75rem; /* 12px */
        --border-radius-lg: 1rem; /* 16px */
        --border-radius-xl: 1.5rem; /* 24px */
      }
      body {
        font-family: var(--font-sans);
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      ::-webkit-scrollbar-thumb {
        background: #d1d5db;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #9ca3af;
      }
      /* Animations */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes modalEnter {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes backgroundFadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes bounceIn {
        0% { opacity: 0; transform: translate(-50%, 20px); }
        50% { opacity: 1; transform: translate(-50%, -5px); }
        100% { opacity: 1; transform: translate(-50%, 0); }
      }
      .animate-fade-in {
        animation: fadeIn 0.4s ease-out forwards;
      }
      .animate-modal-enter {
        animation: modalEnter 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .animate-bg-fade-in {
        animation: backgroundFadeIn 0.3s ease-out forwards;
      }
      .animate-bounce-in {
        animation: bounceIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      /* Print styles for reports */
      @media print {
        body { background: white !important; }
        .print-hidden { display: none !important; }
        
        #print-area-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: white;
            display: block !important;
        }

        /* Override Modal styles during print */
        .fixed.inset-0 { position: static !important; background: white !important; padding: 0 !important; }
        #print-area { 
            box-shadow: none !important; 
            max-height: none !important; 
            width: 100% !important; 
            max-width: none !important;
            padding: 0 !important;
            margin: 0 !important;
            border-radius: 0 !important;
        }
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Cairo', 'sans-serif'],
            },
            borderRadius: {
                'sm': 'var(--border-radius-sm)',
                'md': 'var(--border-radius-md)',
                'lg': 'var(--border-radius-lg)',
                'xl': 'var(--border-radius-xl)',
            }
          },
        },
      }
    </script>
